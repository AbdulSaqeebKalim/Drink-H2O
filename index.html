<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Drink H2O - Clean and smart daily hydration tracker with goal calculation and progress tracking.">
  <meta name="theme-color" content="#0284c7">
  <title>Drink H2O - Daily Hydration Tracker</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
          </svg>
        </div>
        <div>
          <h1 class="brand-title">Drink H2O</h1>
          <p class="brand-subtitle" id="currentDateDisplay">Today</p>
        </div>
      </div>

      <button id="themeToggleBtn" class="icon-btn" aria-label="Toggle theme">
        <svg id="themeIcon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
      </button>
    </header>

    <!-- Goal & Visual Progress Tracker -->
    <main class="main-content">
      <section class="card progress-card">
        <div class="goal-header">
          <div>
            <span class="label">Daily Target</span>
            <div class="goal-value-wrapper">
              <span class="goal-value" id="goalDisplay">2500 ml</span>
              <button id="editGoalBtn" class="text-link" aria-label="Edit goal">Edit</button>
            </div>
          </div>
          <div class="goal-summary-badge" id="completionBadge">0%</div>
        </div>

        <!-- Inline Goal Edit Form (Hidden by default) -->
        <form id="goalEditForm" class="goal-edit-form hidden">
          <label for="goalInput">Set Daily Water Goal (ml):</label>
          <div class="input-inline">
            <input type="number" id="goalInput" min="500" max="6000" step="50" value="2500" required>
            <button type="submit" class="btn btn-primary btn-sm">Save</button>
            <button type="button" id="cancelGoalBtn" class="btn btn-outline btn-sm">Cancel</button>
          </div>
        </form>

        <!-- Circular Water Wave Tracker -->
        <div class="tracker-wrapper">
          <div class="circular-meter">
            <div class="wave-container" id="waveContainer">
              <div class="wave wave-back"></div>
              <div class="wave wave-front"></div>
            </div>
            <div class="meter-content">
              <span class="percentage" id="percentText">0%</span>
              <span class="volume-consumed" id="currentIntakeText">0 ml</span>
              <span class="remaining-volume" id="remainingText">2500 ml left</span>
            </div>
          </div>
        </div>

        <!-- Quick Stats Row -->
        <div class="stats-row">
          <div class="stat-item">
            <span class="stat-num" id="glassesCount">0</span>
            <span class="stat-label">Glasses (250ml)</span>
          </div>
          <div class="stat-divider"></div>
          <div class="stat-item">
            <span class="stat-num" id="statusMessage">Starting</span>
            <span class="stat-label">Status</span>
          </div>
          <div class="stat-divider"></div>
          <div class="stat-item">
            <span class="stat-num" id="logCount">0</span>
            <span class="stat-label">Entries Today</span>
          </div>
        </div>
      </section>

      <!-- Water Logging Controls -->
      <section class="card action-card">
        <h2 class="section-title">Log Water Intake</h2>
        
        <!-- Preset Amount Buttons -->
        <div class="preset-grid">
          <button class="btn btn-preset" data-amount="150">
            <span class="preset-icon">☕</span>
            <span class="preset-amount">+150 ml</span>
            <span class="preset-desc">Small Cup</span>
          </button>
          <button class="btn btn-preset active" data-amount="250">
            <span class="preset-icon">🥛</span>
            <span class="preset-amount">+250 ml</span>
            <span class="preset-desc">Standard Glass</span>
          </button>
          <button class="btn btn-preset" data-amount="500">
            <span class="preset-icon">🍶</span>
            <span class="preset-amount">+500 ml</span>
            <span class="preset-desc">Water Bottle</span>
          </button>
          <button class="btn btn-preset" data-amount="750">
            <span class="preset-icon">🫙</span>
            <span class="preset-amount">+750 ml</span>
            <span class="preset-desc">Large Flask</span>
          </button>
        </div>

        <!-- Custom Intake Input -->
        <form id="customLogForm" class="custom-log-form">
          <div class="input-group">
            <input type="number" id="customAmountInput" placeholder="Custom ml (e.g. 300)" min="10" max="3000" step="10">
            <button type="submit" class="btn btn-primary" id="addCustomBtn">Add Intake</button>
          </div>
        </form>

        <!-- Secondary Actions -->
        <div class="secondary-actions">
          <button id="undoBtn" class="btn btn-outline" title="Subtract last intake">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 7v6h6"></path>
              <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path>
            </svg>
            Subtract 250ml
          </button>
          <button id="resetDayBtn" class="btn btn-danger-outline" title="Reset today's progress to zero">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="1 4 1 10 7 10"></polyline>
              <polyline points="23 20 23 14 17 14"></polyline>
              <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path>
            </svg>
            Reset Day
          </button>
        </div>
      </section>

      <!-- Today's Log History -->
      <section class="card history-card">
        <div class="history-header">
          <h2 class="section-title">Today's Logs</h2>
          <span class="badge" id="totalLoggedBadge">0 ml Total</span>
        </div>
        <ul id="logList" class="log-list">
          <!-- Populated dynamically by script.js -->
        </ul>
        <div id="emptyLogState" class="empty-state">
          <p>No intake logged yet today. Tap any preset above to begin!</p>
        </div>
      </section>
    </main>

    <!-- Toast Notification for In-App Feedback -->
    <div id="toast" class="toast" role="alert" aria-live="polite"></div>

    <footer class="app-footer">
      <p>Drink H2O • Your daily wellness companion</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
